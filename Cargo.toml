[package]
name = "chatgpt_rs"
version = "1.2.3"
edition = "2021"
description = "ChatGPT API Wrapper"
authors = ["Maxuss <maxus.info.mail@proton.me>"]
license = "MIT"
repository = "https://github.com/Maxuss/chatgpt_rs"
keywords = ["ChatGPT", "OpenAI"]
categories = ["api-bindings"]

[lib]
name = "chatgpt"
path = "./src/chatgpt.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13", features = [
    "json",
    "rustls-native-certs",
], default-features = false }
tokio = { version = "1.54.1", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
derive_builder = "0.20.2"

postcard = { version = "1.1.3", features = ["alloc"], optional = true }
eventsource-stream = { version = "0.2.3", optional = true }
futures = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", optional = true }
gpt_fn_macros = { path = "./fn_macros", version = "1.0.0", optional = true }
schemars = { version = "1.2.3", optional = true }
async-trait = { version = "0.1.92", optional = true }
async-recursion = { version = "1.2.0", optional = true }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
chatgpt_rs = { path = ".", features = [
    "json",
    "streams",
    "postcard",
    "functions",
] }
lazy_static = "1.5.1"

[features]
default = ["json"]
streams = ["dep:eventsource-stream", "dep:futures-util", "dep:futures", "reqwest/stream"]
functions = ["dep:gpt_fn_macros", "dep:schemars", "dep:async-trait", "dep:serde_json", "dep:async-recursion"]
functions_extra = ["schemars/chrono04", "schemars/url2", "schemars/uuid1", "schemars/either1"]
json = ["dep:serde_json", "tokio/fs", "tokio/io-util"]
postcard = ["dep:postcard", "tokio/fs", "tokio/io-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
